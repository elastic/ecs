name: "ECS Release: Feature Freeze"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 9.4.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ecs-release-${{ inputs.version }}-ff
  cancel-in-progress: false

jobs:
  feature-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run feature freeze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: scripts
        run: python scripts/release_automation/run_ff.py "${{ inputs.version }}"
