name: docs-build
on:
  pull_request:
    branches: [main, '[0-9]+.[0-9]+']
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  merge_group: ~
permissions:
  contents: read
  pull-requests: read
jobs:
  build:
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@6424787358d5b21453778294bfc93f97e3a0ae2f # v1
    with:
      enable-vale-linting: true
