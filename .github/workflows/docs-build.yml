name: docs-build
on:
  pull_request:
    branches: [main, '[0-9]+.[0-9]+']
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  merge_group: ~
permissions:
  contents: read
  pull-requests: read
jobs:
  build:
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@d81f6d1ca859405eda61e5e376a1b37e00e44b44 # v1
    with:
      enable-vale-linting: true
