name: docs-build
on:
  pull_request:
    branches: [main, '[0-9]+.[0-9]+']
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
  merge_group: ~
permissions:
  contents: read
  pull-requests: read
jobs:
  build:
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@94009ffc9f9df92404ad2c46521f0c8f596f925f # v1
    with:
      enable-vale-linting: true
