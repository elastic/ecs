name: docs-deploy
on:
  workflow_run:
    workflows: [docs-build]
    types: [completed]
permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read
jobs:
  deploy:
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@94009ffc9f9df92404ad2c46521f0c8f596f925f # v1
    with:
      enable-vale-linting: true
      use-release-branches: true
