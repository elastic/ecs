name: docs-deploy
on:
  workflow_run:
    workflows: [docs-build]
    types: [completed]
permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read
jobs:
  deploy:
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@95505a414fa14c79e491ee6666a5a728190e1729 # v1
    with:
      enable-vale-linting: true
      use-release-branches: true
