name: docs-deploy
on:
  workflow_run:
    workflows: [docs-build]
    types: [completed]
permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read
jobs:
  deploy:
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@db1f8230419635afe51434fbd5b3c9214e2e5dc3 # v1
    with:
      enable-vale-linting: true
      use-release-branches: true
