---
# Additive field for schemas/gen_ai.yml (alphabetical after agent.* / before data_source.* if present).
# Proposed for beta maturity; otel relation match to gen_ai.conversation.id.
- name: conversation.id
  type: keyword
  description: >
    The unique identifier for a conversation (session, thread), used to store
    and correlate messages within this conversation.
  example: conv_5j66UpCpwteGg4YSxUnt7lPY
  level: extended
  beta: This field is beta and subject to change.
  otel:
    - relation: match
